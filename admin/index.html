<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم حرّيف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar on the right on desktop, tabs on top on phones; one screen at a time; coach details open in a drawer */
:root{
 --bg:#05201A; --card:#0C3D2D; --card2:#0A3326; --rim:#1B6B52; --lime:#C6F432; --chalk:#F4F7F2; --mint:#B9CDBF; --dim:#7FA08F;
 --ok:#4FD1A5; --warn:#F5B83D; --bad:#FF7A6B; --ink:#05201A;
 --f-title:"Changa","IBM Plex Sans Arabic",system-ui,sans-serif; --f-text:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--chalk);font:15px/1.6 var(--f-text);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-title);font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}
.muted{color:var(--mint)}.dim{color:var(--dim)}.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:16px 48px}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;gap:10px;align-items:center}.mark{width:40px;height:40px;border-radius:12px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font:700 1.3rem var(--f-title)}
.brand small{display:block;color:var(--mint);font-size:.78rem}
nav.tabs{display:flex;flex-direction:column;gap:4px}
nav.tabs button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--mint);text-align:start;font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--card);color:var(--lime)}
nav.tabs .b{margin-inline-start:auto;background:var(--bad);color:var(--ink);font-size:.72rem;font-weight:700;border-radius:20px;padding:0 7px}
.who{font-size:.8rem;color:var(--dim);border-top:1px solid var(--rim);padding-top:12px;word-break:break-all}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.panel{background:var(--card);border-radius:14px;padding:16px;min-width:0}
.kpi .v{font:700 1.9rem/1.1 var(--f-title)}.kpi .l{color:var(--mint);font-size:.86rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.item .g{flex:1 1 220px;min-width:0}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--rim)}
.pill.ok{background:rgba(79,209,165,.15);color:var(--ok);border-color:transparent}.pill.warn{background:rgba(245,184,61,.15);color:var(--warn);border-color:transparent}.pill.bad{background:rgba(255,122,107,.15);color:var(--bad);border-color:transparent}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--card2);border:1px solid var(--rim)}
.btn.p{background:var(--lime);color:var(--ink);border-color:var(--lime)}.btn.bad{color:var(--bad);border-color:rgba(255,122,107,.4)}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.86rem;color:var(--mint)}
input.in,select.in,textarea.in{background:var(--card2);border:1px solid var(--rim);border-radius:10px;padding:10px 12px;width:100%}
.note{border-radius:10px;padding:10px 12px;background:var(--card2);border:1px solid var(--rim);font-size:.9rem}
.note.bad{border-color:rgba(255,122,107,.5);color:var(--bad)}.note.ok{border-color:rgba(79,209,165,.5);color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--card2);border:1px solid var(--rim);border-radius:20px;padding:4px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-start;background:rgba(0,0,0,.5)}
.drawer .d{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);border-inline-end:1px solid var(--rim);padding:20px max(16px,env(safe-area-inset-left,0px)) 40px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.docs figure{margin:0;background:var(--card);border-radius:12px;padding:8px}
.docs img{width:100%;border-radius:8px;display:block;cursor:zoom-in}
.docs figcaption{font-size:.8rem;color:var(--mint);margin-top:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--rim);white-space:nowrap}
th{color:var(--mint);font-weight:500;font-size:.85rem}
.tw{overflow-x:auto}
.login{max-width:400px;margin:12vh auto 0}
.big{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px}
.big img{max-width:100%;max-height:100%}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static}nav.tabs{flex-direction:row;overflow-x:auto}nav.tabs button{white-space:nowrap}}
</style>
</head>
<body>
<div id="root"><div class="login"><p class="muted">لحظة…</p></div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, collection, query, where, orderBy, limit, getCountFromServer, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

// The same Firebase project as the app ("harreef"). These values identify the project; access is guarded by sign-in and the Firestore rules.
const app = initializeApp({
  apiKey: 'AIzaSyBAvs9WVbZ1UTDAI-B016bN78jWkL14zaU', authDomain: 'harreef.firebaseapp.com', projectId: 'harreef',
  storageBucket: 'harreef.firebasestorage.app', messagingSenderId: '117302946172', appId: '1:117302946172:web:82dac723afb2d7639fdcf9',
});
const auth = getAuth(app), db = getFirestore(app);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const egp = (n) => Math.round(+n || 0).toLocaleString('ar-EG') + ' ج';
const dt = (t) => { const d = t && t.toDate ? t.toDate() : t ? new Date(t) : null; return d ? d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }) : '–'; };
const rows = (s) => s.docs.map((d) => Object.assign({ id: d.id }, d.data()));
const LIC = { 'efa-d': 'الاتحاد المصري D', 'efa-c': 'الاتحاد المصري C', 'efa-b': 'الاتحاد المصري B', 'efa-a': 'الاتحاد المصري A', 'caf-d': 'CAF D', 'caf-c': 'CAF C', 'caf-b': 'CAF B', 'caf-a': 'CAF A', 'uefa-c': 'UEFA C', 'uefa-b': 'UEFA B', 'uefa-a': 'UEFA A', other: 'رخصة تانية' };
const BANDS = { 1: '6 لـ9', 2: '10 لـ12', 3: '13 لـ15', 4: '16 لـ18' };
const DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const CST = { pending: ['مستني مراجعة', 'warn'], approved: ['شغال', 'ok'], rejected: ['محتاج تعديل', 'bad'], suspended: ['موقوف', 'bad'] };
const BST = { requested: 'مستني المدرب', accepted: 'المدرب وافق', declined: 'المدرب اعتذر', cancelled: 'اتلغت', done: 'اتعملت' };
const DOCN = { idf: 'البطاقة (الوش)', idb: 'البطاقة (الضهر)', lic: 'الرخصة', fish: 'الفيش', photo: 'الصورة الشخصية', aid: 'الإسعافات الأولية' };
let ME = null, VIEW = 'home', DATA = {}, MSG = '', FILTER = 'pending';

async function audit(what, target, extra) { try { await addDoc(collection(db, 'audit'), Object.assign({ what, target: target || '', by: ME.email, at: serverTimestamp() }, extra || {})); } catch (e) {} }
function toast(m, bad) { MSG = (bad ? '!' : '') + m; draw(); setTimeout(() => { MSG = ''; draw(); }, 3500); }

// ---------- data ----------
async function load() {
  const [coaches, bookings, reports, cfg] = await Promise.all([
    getDocs(collection(db, 'coaches')).then(rows),
    getDocs(query(collection(db, 'bookings'), orderBy('createdAt', 'desc'), limit(500))).then(rows),
    getDocs(query(collection(db, 'reports'), orderBy('at', 'desc'), limit(200))).then(rows),
    getDoc(doc(db, 'config', 'public')).then((s) => (s.exists() ? s.data() : {})),
  ]);
  // temporary suspensions end on their own: the first admin visit after the date reinstates the coach
  const now = Date.now();
  for (const c of coaches) if (c.status === 'suspended' && c.suspendUntil && c.suspendUntil.toMillis() < now) {
    await updateDoc(doc(db, 'coaches', c.id), { status: 'approved', suspendUntil: null, reason: '' }); c.status = 'approved'; await audit('انتهى الإيقاف ورجع شغال', c.id, { name: c.name });
  }
  let players = 0, users = 0, subs = 0;
  try { players = (await getCountFromServer(collection(db, 'players'))).data().count; } catch (e) {}
  try { users = (await getCountFromServer(collection(db, 'users'))).data().count; } catch (e) {}
  try { subs = (await getCountFromServer(query(collection(db, 'users'), where('sub.state', '==', 'active')))).data().count; } catch (e) {}
  DATA = { coaches, bookings, reports, cfg, players, users, subs };
}
async function loadAudit() { DATA.audit = rows(await getDocs(query(collection(db, 'audit'), orderBy('at', 'desc'), limit(100)))); }

// ---------- views ----------
function kpi(v, l, cls) { return `<div class="panel kpi"><div class="v num ${cls || ''}">${v}</div><div class="l">${l}</div></div>`; }
function vHome() {
  const { coaches, bookings, reports, players, users, subs } = DATA;
  const done = bookings.filter((b) => b.status === 'done');
  const gross = done.reduce((s, b) => s + (+b.price || 0), 0), fee = done.reduce((s, b) => s + (+b.price || 0) * (+b.feePct || 0), 0);
  const owe = done.filter((b) => b.payout !== 'paid').reduce((s, b) => s + (+b.price || 0) * (1 - (+b.feePct || 0)), 0);
  const claims = bookings.filter((b) => b.payState === 'claimed').length;
  const pend = coaches.filter((c) => c.status === 'pending').length, open = reports.filter((r) => r.state === 'open').length;
  const exp = coaches.filter((c) => c.status === 'approved' && c.lic && +c.lic.exp && +c.lic.exp <= new Date().getFullYear());
  return `<h1>الرئيسية</h1><p class="muted">الأرقام دي من السيرفر دلوقتي.</p>
  <div class="grid kpis">${kpi(players, 'لاعب على السيرفر')}${kpi(users, 'حساب')}${kpi(subs, 'اشتراك شغال')}${kpi(coaches.filter((c) => c.status === 'approved').length, 'مدرب شغال')}
  ${kpi(pend, 'مدرب مستني مراجعة', pend ? 'warn' : '')}${kpi(claims, 'تحويل مستني تأكيد', claims ? 'warn' : '')}${kpi(open, 'بلاغ مفتوح', open ? 'bad' : '')}${kpi(done.length, 'حصة اتعملت')}
  ${kpi(egp(gross), 'إجمالي الحصص')}${kpi(egp(fee), 'عمولة حرّيف')}${kpi(egp(owe), 'لسه هيتحوّل للمدربين')}</div>
  ${exp.length ? `<div class="note" style="margin-top:14px">رخص بتخلص السنة دي: ${exp.map((c) => esc(c.name)).join('، ')}</div>` : ''}
  ${!DATA.cfg.instapay && !DATA.cfg.vcash ? `<div class="note bad" style="margin-top:14px">لسه ما كتبتش رقم إنستاباي أو فودافون كاش. أولياء الأمور مش هيقدروا يدفعوا. روح «إعدادات الدفع».</div>` : ''}`;
}
function vCoaches() {
  const list = DATA.coaches.filter((c) => FILTER === 'all' || (FILTER === 'flagged' ? c.flagged : c.status === FILTER));
  const f = [['pending', 'مستني مراجعة'], ['approved', 'شغال'], ['rejected', 'محتاج تعديل'], ['suspended', 'موقوف'], ['flagged', 'عليه بلاغ'], ['all', 'الكل']];
  return `<h1>المدربين</h1><div class="chips" style="margin:10px 0 14px">${f.map(([k, n]) => `<button class="chip" data-f="${k}" aria-pressed="${FILTER === k}">${n} (${k === 'all' ? DATA.coaches.length : k === 'flagged' ? DATA.coaches.filter((c) => c.flagged).length : DATA.coaches.filter((c) => c.status === k).length})</button>`).join('')}</div>
  <div class="list">${list.length ? list.map((c) => `<div class="item"><div class="g"><h3>${esc(c.name)}</h3><div class="muted" style="font-size:.86rem">${esc(LIC[c.lic && c.lic.type] || '')} · ${esc(c.pitch || '')} · ${(c.ages || []).map((b) => BANDS[b]).join('، ')} سنة</div>
   <div class="dim" style="font-size:.8rem">اتبعت ${dt(c.submittedAt)}${c.ratingCount ? ` · تقييم ${(c.ratingSum / c.ratingCount).toFixed(1)} من ${c.ratingCount}` : ''}</div></div>
   <span class="pill ${(CST[c.status] || [])[1]}">${(CST[c.status] || [c.status])[0]}</span>${c.flagged ? '<span class="pill bad">عليه بلاغ</span>' : ''}<button class="btn" data-open="${c.id}">افتح</button></div>`).join('') : '<p class="muted">مفيش مدربين هنا.</p>'}</div>`;
}
async function openCoach(id) {
  const c = DATA.coaches.find((x) => x.id === id); if (!c) return;
  const box = document.createElement('div'); box.className = 'drawer'; box.innerHTML = `<div class="d"><p class="muted">بنحمّل الورق…</p></div>`; document.body.appendChild(box);
  box.addEventListener('click', (e) => { if (e.target === box) box.remove(); });
  const priv = rows(await getDocs(collection(db, 'coaches', id, 'private')));
  const contact = priv.find((p) => p.id === 'contact') || {};
  const books = DATA.bookings.filter((b) => b.coachId === id);
  const reps = DATA.reports.filter((r) => r.coachId === id);
  const d = box.firstChild;
  d.innerHTML = `<div class="row between"><h2>${esc(c.name)}</h2><button class="btn" data-x>قفل</button></div>
  <div class="row" style="margin:8px 0"><span class="pill ${(CST[c.status] || [])[1]}">${(CST[c.status] || [c.status])[0]}</span>${c.flagged ? '<span class="pill bad">عليه بلاغ</span>' : ''}</div>
  <div class="panel" style="margin-bottom:12px"><div class="tw"><table><tbody>
   <tr><th>الموبايل</th><td dir="ltr" style="text-align:end">${esc(contact.phone)}</td></tr><tr><th>الإيميل</th><td dir="ltr" style="text-align:end">${esc(contact.email)}</td></tr>
   <tr><th>الرخصة</th><td>${esc(LIC[c.lic && c.lic.type] || '')} · رقم ${esc(c.lic && c.lic.no)} · لحد ${esc(c.lic && c.lic.exp)}</td></tr>
   <tr><th>الملعب</th><td>${esc(c.pitch)} · ${esc(c.addr)}</td></tr><tr><th>بيدرّب</th><td>${(c.ages || []).map((b) => BANDS[b]).join('، ')} سنة · خبرة ${esc(c.years)} سنين</td></tr>
   <tr><th>السعر</th><td>فردية ${egp(c.price1)}${c.priceG ? ' · جماعية ' + egp(c.priceG) : ''}</td></tr><tr><th>المواعيد</th><td>${(c.days || []).map((x) => DAYS[x]).join('، ')} · ${esc(c.from)}–${esc(c.to)}</td></tr>
   <tr><th>الحصص</th><td>${books.filter((b) => b.status === 'done').length} اتعملت · ${books.length} طلب</td></tr></tbody></table></div>
   <p style="margin:10px 0 0">${esc(c.bio)}</p></div>
  <h3>الورق</h3><div class="docs" style="margin:8px 0 14px">${['idf', 'idb', 'lic', 'fish', 'photo', 'aid'].map((k) => { const p = priv.find((x) => x.id === k); return `<figure>${p && p.data ? `<img src="${p.data}" alt="${DOCN[k]}" data-big>` : '<div class="dim" style="padding:30px 0;text-align:center">مش مرفوع</div>'}<figcaption>${DOCN[k]}</figcaption></figure>`; }).join('')}</div>
  ${reps.length ? `<h3>البلاغات</h3><div class="list" style="margin:8px 0 14px">${reps.map((r) => `<div class="note">${esc(r.reason)} · ${dt(r.at)} · ${r.state === 'open' ? 'مفتوح' : 'اتقفل'}</div>`).join('')}</div>` : ''}
  <h3>القرار</h3>
  <div class="field" style="margin-top:8px"><label for="why">السبب أو المطلوب من المدرب (بيظهرله في التطبيق)</label><textarea class="in" id="why" rows="2">${esc(c.reason || '')}</textarea></div>
  <div class="row" style="margin-bottom:10px">
   ${c.status !== 'approved' ? '<button class="btn p" data-do="approve">وافق وفعّل</button>' : ''}
   ${c.status === 'pending' ? '<button class="btn" data-do="reject">اطلب تعديل أو مستند جديد</button>' : ''}
   ${c.flagged ? '<button class="btn" data-do="unflag">البلاغ اتراجع · رجّعه يظهر</button>' : ''}
  </div>
  ${c.status === 'approved' || c.status === 'suspended' ? `<div class="row"><select class="in" id="days" style="width:auto">${[[7, 'أسبوع'], [14, 'أسبوعين'], [30, 'شهر'], [90, '3 شهور'], [0, 'نهائي']].map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select><button class="btn bad" data-do="suspend">أوقفه</button>${c.status === 'suspended' ? '<button class="btn p" data-do="approve">رجّعه يشتغل</button>' : ''}</div>` : ''}`;
  d.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.matches('[data-x]')) return box.remove();
    if (t.matches('[data-big]')) { const b = document.createElement('div'); b.className = 'big'; b.innerHTML = `<img src="${t.src}" alt="">`; b.onclick = () => b.remove(); document.body.appendChild(b); return; }
    const a = t.dataset && t.dataset.do; if (!a) return;
    t.disabled = true; const why = $('#why', d).value.trim();
    try {
      if (a === 'approve') { await updateDoc(doc(db, 'coaches', id), { status: 'approved', reason: '', suspendUntil: null }); await audit('وافق على مدرب', id, { name: c.name }); }
      if (a === 'reject') { if (!why) { toast('اكتب المطلوب من المدرب الأول.', 1); t.disabled = false; return; } await updateDoc(doc(db, 'coaches', id), { status: 'rejected', reason: why }); await audit('طلب تعديل من مدرب', id, { name: c.name, why }); }
      if (a === 'unflag') { await updateDoc(doc(db, 'coaches', id), { flagged: false }); for (const r of reps.filter((x) => x.state === 'open')) await updateDoc(doc(db, 'reports', r.id), { state: 'closed', closedBy: ME.email }); await audit('قفل بلاغ ورجّع المدرب يظهر', id, { name: c.name }); }
      if (a === 'suspend') { const n = +$('#days', d).value; await updateDoc(doc(db, 'coaches', id), { status: 'suspended', reason: why, suspendUntil: n ? Timestamp.fromMillis(Date.now() + n * 864e5) : null }); for (const r of reps.filter((x) => x.state === 'open')) await updateDoc(doc(db, 'reports', r.id), { state: 'closed', closedBy: ME.email }); await audit(n ? 'أوقف مدرب ' + n + ' يوم' : 'أوقف مدرب نهائي', id, { name: c.name, why }); }
      box.remove(); await load(); toast('اتحفظ.');
    } catch (err) { t.disabled = false; toast('ما اتحفظش: ' + err.message, 1); }
  });
}
function vPay() {
  const claims = DATA.bookings.filter((b) => b.payState === 'claimed');
  const owe = DATA.bookings.filter((b) => b.status === 'done' && b.payState === 'confirmed' && b.payout !== 'paid');
  const byCoach = {}; owe.forEach((b) => { (byCoach[b.coachId] = byCoach[b.coachId] || []).push(b); });
  const name = (id) => (DATA.coaches.find((c) => c.id === id) || {}).name || id;
  return `<h1>الحجوزات والفلوس</h1>
  <h2 style="margin-top:14px">تحويلات مستنية تأكيدك (${claims.length})</h2><p class="muted" style="font-size:.9rem">اتأكد إن الفلوس وصلت على إنستاباي أو فودافون كاش برقم العملية، وبعدين أكّد.</p>
  <div class="list">${claims.length ? claims.map((b) => `<div class="item"><div class="g"><h3>${egp(b.price)} · ${b.payMethod === 'vcash' ? 'فودافون كاش' : 'إنستاباي'}</h3><div class="muted" style="font-size:.86rem">رقم العملية: <b dir="ltr">${esc(b.payRef)}</b> · ${dt(b.paidAt)}</div><div class="dim" style="font-size:.82rem">${esc(b.coachName)} · ${esc(b.playerFirst)} · ${esc(b.date)} ${esc(b.time)}</div></div><button class="btn p" data-pay="${b.id}:ok">الفلوس وصلت · أكّد</button><button class="btn bad" data-pay="${b.id}:no">ما وصلتش</button></div>`).join('') : '<p class="muted">مفيش.</p>'}</div>
  <h2 style="margin-top:22px">حق المدربين بعد العمولة</h2><p class="muted" style="font-size:.9rem">حوّل لكل مدرب حقه، وبعدين علّم إنه اتحوّل.</p>
  <div class="list">${Object.keys(byCoach).length ? Object.entries(byCoach).map(([id, bs]) => { const net = bs.reduce((s, b) => s + b.price * (1 - b.feePct), 0); return `<div class="item"><div class="g"><h3>${esc(name(id))}</h3><div class="muted" style="font-size:.86rem">${bs.length} حصة · العمولة ${egp(bs.reduce((s, b) => s + b.price * b.feePct, 0))}</div></div><b class="num">${egp(net)}</b><button class="btn p" data-out="${id}">اتحوّل</button></div>`; }).join('') : '<p class="muted">مفيش فلوس متأخرة لحد.</p>'}</div>
  <h2 style="margin-top:22px">كل الحجوزات</h2><div class="panel tw"><table><thead><tr><th>الميعاد</th><th>المدرب</th><th>اللاعب</th><th>السعر</th><th>العمولة</th><th>الحالة</th><th>الدفع</th></tr></thead><tbody>
  ${DATA.bookings.slice(0, 200).map((b) => `<tr><td>${esc(b.date)} ${esc(b.time)}</td><td>${esc(b.coachName)}</td><td>${esc(b.playerFirst)} · ${esc(b.playerAge)}</td><td>${egp(b.price)}</td><td>${Math.round((b.feePct || 0) * 100)}%</td><td>${BST[b.status] || b.status}</td><td>${b.payState === 'confirmed' ? 'اتأكد' : b.payState === 'claimed' ? 'مستني' : '–'}${b.payout === 'paid' ? ' · اتحوّل للمدرب' : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
function vReports() {
  const name = (id) => (DATA.coaches.find((c) => c.id === id) || {}).name || id;
  return `<h1>البلاغات والشكاوى</h1><p class="muted">أي بلاغ بيخفي المدرب من التطبيق لحد ما تقرر.</p><div class="list">${DATA.reports.length ? DATA.reports.map((r) => `<div class="item"><div class="g"><h3>${esc(name(r.coachId))}</h3><div class="muted" style="font-size:.88rem">${esc(r.reason)}</div><div class="dim" style="font-size:.8rem">${dt(r.at)}</div></div><span class="pill ${r.state === 'open' ? 'bad' : ''}">${r.state === 'open' ? 'مفتوح' : 'اتقفل'}</span><button class="btn" data-open="${r.coachId}">افتح المدرب</button></div>`).join('') : '<p class="muted">مفيش بلاغات.</p>'}</div>`;
}
function vSettings() {
  const c = DATA.cfg;
  return `<h1>إعدادات الدفع</h1><p class="muted">اللي هتكتبه هنا بيظهر لولي الأمر في التطبيق وقت الدفع.</p>
  <div class="panel" style="max-width:520px">
   <div class="field"><label for="ip">رقم أو عنوان إنستاباي</label><input class="in" id="ip" dir="ltr" value="${esc(c.instapay || '')}" autocomplete="off"></div>
   <div class="field"><label for="vc">رقم فودافون كاش</label><input class="in" id="vc" dir="ltr" inputmode="tel" value="${esc(c.vcash || '')}" autocomplete="off"></div>
   <div class="field"><label for="pn">الاسم اللي هيظهر لولي الأمر وهو بيحوّل</label><input class="in" id="pn" value="${esc(c.payName || '')}"></div>
   <button class="btn p" data-save-cfg>احفظ</button></div>`;
}
function vAudit() {
  const a = DATA.audit;
  return `<h1>السجل</h1><p class="muted">كل قرار اتاخد من اللوحة.</p>${a ? `<div class="panel tw"><table><thead><tr><th>الوقت</th><th>مين</th><th>إيه اللي حصل</th><th>على مين</th></tr></thead><tbody>${a.map((x) => `<tr><td>${dt(x.at)}</td><td dir="ltr">${esc(x.by)}</td><td>${esc(x.what)}${x.why ? ' · ' + esc(x.why) : ''}</td><td>${esc(x.name || '')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">لحظة…</p>'}`;
}
const VIEWS = { home: ['الرئيسية', vHome], coaches: ['المدربين', vCoaches], pay: ['الحجوزات والفلوس', vPay], reports: ['البلاغات', vReports], settings: ['إعدادات الدفع', vSettings], audit: ['السجل', vAudit] };
function badge(k) { if (!DATA.coaches) return 0; if (k === 'coaches') return DATA.coaches.filter((c) => c.status === 'pending').length; if (k === 'pay') return DATA.bookings.filter((b) => b.payState === 'claimed').length; if (k === 'reports') return DATA.reports.filter((r) => r.state === 'open').length; return 0; }
function draw() {
  const root = $('#root');
  if (!ME) return;
  root.innerHTML = `<div class="shell"><aside class="side"><div class="brand"><div class="mark">ح</div><div><strong>حرّيف</strong><small>لوحة التحكم</small></div></div>
   <nav class="tabs">${Object.entries(VIEWS).map(([k, [n]]) => `<button data-v="${k}" ${VIEW === k ? 'aria-current="page"' : ''}>${n}${badge(k) ? `<span class="b">${badge(k)}</span>` : ''}</button>`).join('')}</nav>
   <div class="who">${esc(ME.email)}<br><button class="btn" data-out-me style="margin-top:8px">خروج</button> <button class="btn" data-reload style="margin-top:8px">تحديث</button></div></aside>
   <main>${MSG ? `<div class="note ${MSG[0] === '!' ? 'bad' : 'ok'}" style="margin-bottom:12px">${esc(MSG.replace(/^!/, ''))}</div>` : ''}${DATA.coaches ? VIEWS[VIEW][1]() : '<p class="muted">بنحمّل البيانات…</p>'}</main></div>`;
}
function loginView(err) {
  $('#root').innerHTML = `<div class="login panel"><div class="brand" style="margin-bottom:14px"><div class="mark">ح</div><div><strong>حرّيف</strong><small>لوحة التحكم</small></div></div>
  <form id="lf"><div class="field"><label for="em">الإيميل</label><input class="in" id="em" type="email" dir="ltr" autocomplete="username" required></div>
  <div class="field"><label for="pw">كلمة السر</label><input class="in" id="pw" type="password" dir="ltr" autocomplete="current-password" required></div>
  ${err ? `<div class="note bad" style="margin-bottom:12px">${esc(err)}</div>` : ''}<button class="btn p" style="width:100%">ادخل</button></form>
  <button class="btn" id="gg" style="width:100%;margin-top:8px">ادخل بحساب جوجل</button>
  <button class="btn" id="fp" style="width:100%;margin-top:8px">نسيت كلمة السر</button></div>`;
  $('#gg').addEventListener('click', async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (x) { loginView('ما قدرتش أدخل بجوجل. جرّب تاني.'); } });
  $('#lf').addEventListener('submit', async (e) => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value); } catch (x) { loginView('الإيميل أو كلمة السر غلط.'); } });
  $('#fp').addEventListener('click', async () => { const m = $('#em').value.trim(); if (!m) return loginView('اكتب إيميلك فوق الأول.'); try { await sendPasswordResetEmail(auth, m); loginView('بعتنالك لينك تغيّر بيه كلمة السر.'); } catch (x) { loginView('ما قدرتش أبعت. اتأكد من الإيميل.'); } });
}
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t || !ME) return;
  if (t.dataset.v) { VIEW = t.dataset.v; draw(); if (VIEW === 'audit') { await loadAudit(); draw(); } return; }
  if (t.dataset.f) { FILTER = t.dataset.f; draw(); return; }
  if (t.dataset.open) return openCoach(t.dataset.open);
  if (t.hasAttribute('data-out-me')) return signOut(auth);
  if (t.hasAttribute('data-reload')) { await load(); draw(); return; }
  if (t.dataset.pay) { const [id, ok] = t.dataset.pay.split(':'); t.disabled = true; try { await updateDoc(doc(db, 'bookings', id), ok === 'ok' ? { payState: 'confirmed', confirmedBy: ME.email, confirmedAt: serverTimestamp() } : { payState: 'none', payRef: '', payMethod: '' }); await audit(ok === 'ok' ? 'أكّد تحويل' : 'رفض تحويل (ما وصلش)', id); await load(); toast('اتحفظ.'); } catch (x) { toast('ما اتحفظش: ' + x.message, 1); } return; }
  if (t.dataset.out) { const id = t.dataset.out; t.disabled = true; try { const bs = DATA.bookings.filter((b) => b.coachId === id && b.status === 'done' && b.payState === 'confirmed' && b.payout !== 'paid'); for (const b of bs) await updateDoc(doc(db, 'bookings', b.id), { payout: 'paid', paidOutAt: serverTimestamp() }); await audit('حوّل حق مدرب (' + bs.length + ' حصة)', id, { name: (DATA.coaches.find((c) => c.id === id) || {}).name }); await load(); toast('اتعلّم إنه اتحوّل.'); } catch (x) { toast('ما اتحفظش: ' + x.message, 1); } return; }
  if (t.hasAttribute('data-save-cfg')) { t.disabled = true; try { const v = { instapay: $('#ip').value.trim(), vcash: $('#vc').value.trim(), payName: $('#pn').value.trim(), fee1: 0.12, fee2: 0.07, after: 5, updatedAt: serverTimestamp() }; await setDoc(doc(db, 'config', 'public'), v, { merge: true }); await audit('غيّر إعدادات الدفع', 'config'); await load(); toast('اتحفظ. أولياء الأمور هيشوفوا الأرقام دي وقت الدفع.'); } catch (x) { t.disabled = false; toast('ما اتحفظش: ' + x.message, 1); } }
});
onAuthStateChanged(auth, async (u) => {
  if (!u) { ME = null; return loginView(); }
  const a = await getDoc(doc(db, 'admins', u.uid)).catch(() => null);
  if (!a || !a.exists()) { ME = null; await signOut(auth); return loginView('الحساب ده مش مدير.'); }
  ME = { uid: u.uid, email: u.email }; draw();
  try { await load(); } catch (x) { MSG = '!ما قدرتش أحمّل البيانات: ' + x.message; }
  draw();
});
</script>
</body>
</html>

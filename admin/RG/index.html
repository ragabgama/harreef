<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sidebar on the right on desktop, tabs on top on phones; one screen at a time; coach details open in a drawer */
:root{
 --bg:#05201A; --card:#0C3D2D; --card2:#0A3326; --rim:#1B6B52; --lime:#C6F432; --chalk:#F4F7F2; --mint:#B9CDBF; --dim:#7FA08F;
 --ok:#4FD1A5; --warn:#F5B83D; --bad:#FF7A6B; --ink:#05201A;
 --f-title:"Changa","IBM Plex Sans Arabic",system-ui,sans-serif; --f-text:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--chalk);font:15px/1.6 var(--f-text);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-title);font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}
.muted{color:var(--mint)}.dim{color:var(--dim)}.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:16px 48px}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;gap:10px;align-items:center}.mark{width:40px;height:40px;border-radius:12px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font:700 1.3rem var(--f-title)}
.brand small{display:block;color:var(--mint);font-size:.78rem}
nav.tabs{display:flex;flex-direction:column;gap:4px}
nav.tabs button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--mint);text-align:start;font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--card);color:var(--lime)}
nav.tabs .b{margin-inline-start:auto;background:var(--bad);color:var(--ink);font-size:.72rem;font-weight:700;border-radius:20px;padding:0 7px}
.who{font-size:.8rem;color:var(--dim);border-top:1px solid var(--rim);padding-top:12px;word-break:break-all}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.panel{background:var(--card);border-radius:14px;padding:16px;min-width:0}
.kpi .v{font:700 1.9rem/1.1 var(--f-title)}.kpi .l{color:var(--mint);font-size:.86rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.item .g{flex:1 1 220px;min-width:0}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--rim)}
.pill.ok{background:rgba(79,209,165,.15);color:var(--ok);border-color:transparent}.pill.warn{background:rgba(245,184,61,.15);color:var(--warn);border-color:transparent}.pill.bad{background:rgba(255,122,107,.15);color:var(--bad);border-color:transparent}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--card2);border:1px solid var(--rim)}
.btn.p{background:var(--lime);color:var(--ink);border-color:var(--lime)}.btn.bad{color:var(--bad);border-color:rgba(255,122,107,.4)}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.86rem;color:var(--mint)}
input.in,select.in,textarea.in{background:var(--card2);border:1px solid var(--rim);border-radius:10px;padding:10px 12px;width:100%}
.note{border-radius:10px;padding:10px 12px;background:var(--card2);border:1px solid var(--rim);font-size:.9rem}
.note.bad{border-color:rgba(255,122,107,.5);color:var(--bad)}.note.ok{border-color:rgba(79,209,165,.5);color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--card2);border:1px solid var(--rim);border-radius:20px;padding:4px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}

.drawer .d{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);border-inline-end:1px solid var(--rim);padding:20px max(16px,env(safe-area-inset-left,0px)) 40px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.docs figure{margin:0;background:var(--card);border-radius:12px;padding:8px}
.docs img{width:100%;border-radius:8px;display:block;cursor:zoom-in}
.docs figcaption{font-size:.8rem;color:var(--mint);margin-top:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--rim);white-space:nowrap}
th{color:var(--mint);font-weight:500;font-size:.85rem}
.tw{overflow-x:auto}
.login{max-width:400px;margin:12vh auto 0}
.big{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px}
.big img{max-width:100%;max-height:100%}
/* indicators and charts (same look as the design preview) */
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-top:14px}
button.kpi{border:0;text-align:start;display:flex;flex-direction:column;gap:2px}
button.kpi:hover{outline:1px solid var(--rim)}
.kpi .f{font-size:.8rem;color:var(--dim)}
.kpi.hot .v{color:var(--lime)}.kpi .v.warn{color:var(--warn)}.kpi .v.bad{color:var(--bad)}
.kpi .v small{font-size:.9rem;color:var(--mint);font-weight:500}
.panel header{margin-bottom:12px}.panel header p{margin:2px 0 0;color:var(--mint);font-size:.84rem}
.att{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(27,107,82,.55)}
.att:first-child{border-top:0}.att .t{flex:1;min-width:0;font-weight:600}
.sev{width:4px;align-self:stretch;border-radius:4px;flex:none}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px;background:repeating-linear-gradient(to top,rgba(185,205,191,.09) 0 1px,transparent 1px 50px)}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cols .bar{width:100%;max-width:30px;background:var(--rim);border-radius:5px 5px 2px 2px;min-height:2px}
.cols .c:last-child .bar{background:var(--lime)}
.cols .c .vv{font-size:.7rem;color:var(--mint);font-variant-numeric:tabular-nums}
.cols .c:last-child .vv{color:var(--lime);font-weight:600}
.stackcol{width:100%;max-width:44px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:2px;background:var(--card2)}
.xl{display:flex;gap:4px;margin-top:6px}.xl span{flex:1;text-align:center;font-size:.68rem;color:var(--dim);min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mint);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:78px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.86rem}
.hb .track{height:12px;border-radius:6px;background:var(--card2);overflow:hidden}
.hb .fill{height:100%;background:var(--rim);border-radius:6px}.hb .fill.top{background:var(--lime)}
.hb .n{text-align:end;font-variant-numeric:tabular-nums;color:var(--mint)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--card2)}.stack span{display:block;height:100%}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem;margin:0}.facts dt{color:var(--mint)}.facts dd{margin:0}
.empty{color:var(--dim);font-size:.88rem;padding:18px 0;text-align:center}
.search{position:relative;max-width:360px;margin:10px 0 0}
.qres{position:absolute;inset-inline:0;top:calc(100% + 4px);z-index:30;background:var(--card2);border:1px solid var(--rim);border-radius:10px;overflow:hidden}
.qres button{display:block;width:100%;text-align:start;background:none;border:0;padding:9px 12px;border-top:1px solid var(--rim)}
.qres button:first-child{border-top:0}.qres button:hover{background:var(--card)}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:1.5rem}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static}nav.tabs{flex-direction:row;overflow-x:auto}nav.tabs button{white-space:nowrap}}
</style>
</head>

<script type="module">

import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, deleteDoc, collection, query, where, orderBy, limit, getCountFromServer, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

// The same Firebase project as the app ("harreef"). These values identify the project; access is guarded by sign-in and the Firestore rules.
const app = initializeApp({
  apiKey: 'AIzaSyBAvs9WVbZ1UTDAI-B016bN78jWkL14zaU', authDomain: 'harreef.firebaseapp.com', projectId: 'harreef',
  storageBucket: 'harreef.firebasestorage.app', messagingSenderId: '117302946172', appId: '1:117302946172:web:82dac723afb2d7639fdcf9',
});
const auth = getAuth(app), db = getFirestore(app);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const egp = (n) => Math.round(+n || 0).toLocaleString('ar-EG') + ' ج';
const dt = (t) => { const d = t && t.toDate ? t.toDate() : t ? new Date(t) : null; return d ? d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }) : '–'; };
const rows = (s) => s.docs.map((d) => Object.assign({ id: d.id }, d.data()));
const LIC = { 'efa-d': 'الاتحاد المصري D', 'efa-c': 'الاتحاد المصري C', 'efa-b': 'الاتحاد المصري B', 'efa-a': 'الاتحاد المصري A', 'caf-d': 'CAF D', 'caf-c': 'CAF C', 'caf-b': 'CAF B', 'caf-a': 'CAF A', 'uefa-c': 'UEFA C', 'uefa-b': 'UEFA B', 'uefa-a': 'UEFA A', other: 'رخصة تانية' };
const BANDS = { 1: '6 لـ9', 2: '10 لـ12', 3: '13 لـ15', 4: '16 لـ18' };
const DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const CST = { pending: ['مستني مراجعة', 'warn'], approved: ['شغال', 'ok'], rejected: ['محتاج تعديل', 'bad'], suspended: ['موقوف', 'bad'] };
const BST = { requested: 'مستني المدرب', accepted: 'المدرب وافق', declined: 'المدرب اعتذر', cancelled: 'اتلغت', done: 'اتعملت' };
const DOCN = { idf: 'البطاقة (الوش)', idb: 'البطاقة (الضهر)', lic: 'الرخصة', fish: 'الفيش', photo: 'الصورة الشخصية', aid: 'الإسعافات الأولية' };
let ME = null, VIEW = 'home', DATA = {}, MSG = '', FILTER = 'pending';
// who sees what: the owner sees everything and manages users; a reviewer handles coaches and reports; finance handles money
const ROLES = { owner: 'المالك · كل حاجة', reviewer: 'مراجع المدربين والبلاغات', finance: 'الفلوس والتحويلات' };
const CAN = { owner: ['home', 'coaches', 'players', 'money', 'pay', 'reports', 'settings', 'users', 'audit'], reviewer: ['home', 'coaches', 'players', 'reports'], finance: ['home', 'money', 'pay'] };

async function audit(what, target, extra) { try { await addDoc(collection(db, 'audit'), Object.assign({ what, target: target || '', by: ME.email, at: serverTimestamp() }, extra || {})); } catch (e) {} }
function toast(m, bad) { MSG = (bad ? '!' : '') + m; draw(); setTimeout(() => { MSG = ''; draw(); }, 3500); }

// ---------- data ----------
async function load() {
  const [coaches, bookings, reports, cfg] = await Promise.all([
    getDocs(collection(db, 'coaches')).then(rows),
    getDocs(query(collection(db, 'bookings'), orderBy('createdAt', 'desc'), limit(500))).then(rows),
    getDocs(query(collection(db, 'reports'), orderBy('at', 'desc'), limit(200))).then(rows),
    getDoc(doc(db, 'config', 'public')).then((s) => (s.exists() ? s.data() : {})),
  ]);
  // temporary suspensions end on their own: the first admin visit after the date reinstates the coach
  const now = Date.now();
  for (const c of coaches) if (c.status === 'suspended' && c.suspendUntil && c.suspendUntil.toMillis() < now) {
    await updateDoc(doc(db, 'coaches', c.id), { status: 'approved', suspendUntil: null, reason: '' }); c.status = 'approved'; await audit('انتهى الإيقاف ورجع شغال', c.id, { name: c.name });
  }
  // players: only what the panel counts (first name, birth year, positions, last training); photos and PINs are dropped here
  let plist = [], ulist = [];
  try { plist = (await getDocs(query(collection(db, 'players'), limit(3000)))).docs.map(slimPlayer); } catch (e) {}
  try { ulist = rows(await getDocs(query(collection(db, 'users'), limit(5000)))).map((u) => ({ id: u.id, sub: u.sub || null, at: ms(u.updatedAt) })); } catch (e) {}
  const subOf = {}; ulist.forEach((u) => { subOf[u.id] = u.sub && u.sub.state; });
  plist.forEach((p) => { p.sub = subOf[p.owner] || 'none'; });
  const subs = ulist.filter((u) => u.sub && u.sub.state === 'active').length;

const ms = (t) => (t && t.toMillis ? t.toMillis() : typeof t === 'number' ? t : t ? Date.parse(t) || 0 : 0);
const DAY = 864e5;
function slimPlayer(d) {
  const x = d.data(), s = x.summary || {};
  let pos = [];
  try { const st = typeof x.state === 'string' ? JSON.parse(x.state) : x.state; pos = (st && st.profile && st.profile.positions) || []; } catch (e) {}
  const parts = String(x.name || '').trim().split(/\s+/);
  return { id: d.id, owner: x.owner, short: parts[0] ? parts[0] + (parts[1] ? ' ' + parts[1][0] + '.' : '') : 'لاعب', year: +x.year || null, pos,
    week: +s.week || 0, weekMin: +s.weekMin || 0, points: +s.points || 0, last: s.last ? Date.parse(s.last + 'T12:00:00') || 0 : 0, upd: ms(x.updatedAt), parent: (x.parentEmails || []).length > 0 };
}
async function loadAudit() { DATA.audit = rows(await getDocs(query(collection(db, 'audit'), orderBy('at', 'desc'), limit(100)))); }

// ---------- views ----------
function kpi(v, l, cls) { return `<div class="panel kpi"><div class="v num ${cls || ''}">${v}</div><div class="l">${l}</div></div>`; }
// clickable tile: value, label, a small line under it, and the screen it opens
function tile(v, l, foot, go, cls) { return `<button class="panel kpi ${cls === 'hot' ? 'hot' : ''}" data-v="${go}"><span class="l">${l}</span><span class="v num ${cls && cls !== 'hot' ? cls : ''}">${v}</span>${foot ? `<span class="f">${foot}</span>` : ''}</button>`; }
const n0 = (n) => Math.round(+n || 0).toLocaleString('ar-EG');
function columns(vals, labels, fmtv) {
  const max = Math.max(...vals, 0) || 1, f = fmtv || n0;
  return `<div class="cols" role="img" aria-label="${labels.map((l, i) => l + ': ' + vals[i]).join('، ')}">${vals.map((v) => `<div class="c"><span class="vv">${v ? f(v) : ''}</span><div class="bar" style="height:${(v / max) * 82}%"></div></div>`).join('')}</div>
  <div class="xl">${labels.map((l) => `<span>${l}</span>`).join('')}</div>`;
}
function hbars(list, unit) {
  const max = Math.max(...list.map((r) => r[1]), 0) || 1;
  if (!list.some((r) => r[1])) return `<div class="empty">لسه مفيش بيانات.</div>`;
  return `<div class="hbars">${list.map(([l, v]) => `<div class="hb"><span>${l}</span><div class="track"><div class="fill ${v === max ? 'top' : ''}" style="width:${(v / max) * 100}%"></div></div><span class="n">${n0(v)}</span></div>`).join('')}</div>${unit ? `<div class="legend"><span>${unit}</span></div>` : ''}`;
}
const SUBC = { active: ['مشترك', 'var(--lime)'], none: ['من غير اشتراك', 'var(--rim)'] };
function subStack() {
  const u = DATA.ulist, act = u.filter((x) => x.sub && x.sub.state === 'active').length, none = u.length - act;

  <div class="legend">${[[act, 'active'], [none, 'none']].map(([v, k]) => `<span><i style="background:${SUBC[k][1]}"></i>${SUBC[k][0]} · <b class="num">${n0(v)}</b></span>`).join('')}</div>`;
}
function last(nDays) { const out = []; const t = new Date(); t.setHours(12, 0, 0, 0); for (let i = nDays - 1; i >= 0; i--) out.push(t.getTime() - i * DAY); return out; }
const sameDay = (a, b) => { const x = new Date(a), y = new Date(b); return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate(); };
const dayLbl = (t, i, n) => (i === n - 1 ? 'النهارده' : String(new Date(t).getDate()));
const ageOf = (p) => (p.year ? new Date().getFullYear() - p.year : null);
const BANDROWS = [['6–9 سنين', 6, 9], ['10–12 سنة', 10, 12], ['13–15 سنة', 13, 15], ['16–18 سنة', 16, 18]];
const POSN = { winger: 'جناح', striker: 'مهاجم', mid: 'وسط', def: 'مدافع', gk: 'حارس مرمى' };
const actAt = (p) => Math.max(p.last || 0, p.upd || 0);
function money() {
  const B = DATA.bookings, paid = B.filter((b) => b.payState === 'confirmed');
  const done = B.filter((b) => b.status === 'done' && b.payState === 'confirmed');

    paid, done, gross: paid.reduce((s, b) => s + (+b.price || 0), 0), cut: done.reduce((s, b) => s + fee(b), 0),
    cutMonth: done.filter(inMonth).reduce((s, b) => s + fee(b), 0), grossMonth: paid.filter(inMonth).reduce((s, b) => s + (+b.price || 0), 0),

    owe: done.filter((b) => b.payout !== 'paid').reduce((s, b) => s + (+b.price || 0) - fee(b), 0),
    refunded: B.filter((b) => b.payState === 'refunded').length, cancelled: B.filter((b) => b.status === 'cancelled').length,
  };
}
function attention() {
  const { coaches, bookings, reports } = DATA, a = [];
  const open = reports.filter((r) => r.state === 'open').length, pend = coaches.filter((c) => c.status === 'pending').length;
  const claims = bookings.filter((b) => b.payState === 'claimed').length, m = money();
  const yr = new Date().getFullYear(), exp = coaches.filter((c) => c.status === 'approved' && c.lic && +c.lic.exp && +c.lic.exp <= yr).length;
  if (!DATA.cfg.instapay && !DATA.cfg.vcash) a.push(['bad', 'لسه ما كتبتش رقم إنستاباي أو فودافون كاش. أولياء الأمور مش هيقدروا يدفعوا.', 'settings', 'اكتب الأرقام']);

onAuthStateChanged(auth, async (u) => {

  let a = await getDoc(doc(db, 'admins', u.uid)).catch(() => null);
  if ((!a || !a.exists()) && u.email) {
    // first sign-in of someone the owner added: turn the invite into access
    const em = u.email.toLowerCase(), inv = await getDoc(doc(db, 'invites', em)).catch(() => null);
    if (inv && inv.exists()) { try { await setDoc(doc(db, 'admins', u.uid), { role: inv.data().role, email: em, at: serverTimestamp() }); await deleteDoc(doc(db, 'invites', em)); a = await getDoc(doc(db, 'admins', u.uid)); } catch (x) {} }
  }
  if (!a || !a.exists()) { ME = null; await signOut(auth); return loginView('الحساب ده ملوش صلاحية على لوحة التحكم.'); }
  ME = { uid: u.uid, email: u.email, role: a.data().role || 'owner' };
  if (!a.data().email && u.email) updateDoc(doc(db, 'admins', u.uid), { email: u.email.toLowerCase() }).catch(() => {}); if (!(CAN[ME.role] || []).includes(VIEW)) VIEW = 'home'; draw();
  try { await load(); } catch (x) { MSG = '!ما قدرتش أحمّل البيانات: ' + x.message; }
  draw();
});
</script>
